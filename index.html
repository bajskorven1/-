<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NEON RUNNER 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; font-size: 24px; font-weight: bold; }
        #go { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(10,10,30,0.9); padding: 30px; border-radius: 15px; border: 2px solid #ff0055; color: white; }
        button { background: #00ffcc; border: none; padding: 10px 20px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="ui">POÄNG: <span id="score">0</span></div>
    <div id="go"><h1>GAME OVER</h1><button onclick="reset()">SPELA IGEN</button></div>
    <script>
        let scene, camera, renderer, player, platforms = [], score = 0, isOver = false;
        let keys = { w:0, a:0, s:0, d:0 }, velY = 0, jumping = false;
        function init() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0a18);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            let light = new THREE.DirectionalLight(0x00ffff, 0.8); light.position.set(10,20,10); scene.add(light);
            player = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({ color: 0x00ffcc }));
            player.position.set(0,1,0); scene.add(player);
            buildTrack();
            window.addEventListener('keydown', e => handle(e, 1)); window.addEventListener('keyup', e => handle(e, 0));
            animate();
        }
        function buildTrack() {
            platforms.forEach(p => scene.remove(p)); platforms = []; let z = 0;
            for (let i=0; i<30; i++) {
                let w = i===0 ? 4 : Math.random()*3+2, l = i===0 ? 10 : Math.random()*5+5, x = i===0 ? 0 : (Math.random()-0.5)*4;
                let plat = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, l), new THREE.MeshStandardMaterial({ color: i%2===0?0xff0055:0x7a00ff }));
                plat.position.set(x, 0, z); plat.userData = { w:w, l:l }; scene.add(plat); platforms.push(plat);
                z -= l + (Math.random()*3+2);
            }
        }
        function handle(e, val) {
            if (e.code==='KeyW' || e.code==='ArrowUp') keys.w = val;
            if (e.code==='KeyS' || e.code==='ArrowDown') keys.s = val;
            if (e.code==='KeyA' || e.code==='ArrowLeft') keys.a = val;
            if (e.code==='KeyD' || e.code==='ArrowRight') keys.d = val;
            if (e.code==='Space' && val && !jumping) { velY = 0.2; jumping = true; }
        }
        function animate() {
            if (isOver) return; requestAnimationFrame(animate);
            if (keys.w) player.position.z -= 0.15; if (keys.s) player.position.z += 0.15;
            if (keys.a) player.position.x -= 0.1; if (keys.d) player.position.x += 0.1;
            player.position.y += velY; let onG = false;
            for (let p of platforms) {
                let pd = p.userData, pX = player.position.x, pZ = player.position.z;
                if (pX >= p.position.x-pd.w/2-0.4 && pX <= p.position.x+pd.w/2+0.4 && pZ >= p.position.z-pd.l/2-0.4 && pZ <= p.position.z+pd.l/2+0.4) {
                    if (player.position.y >= p.position.y+0.25 && player.position.y <= p.position.y+0.75 && velY <= 0) {
                        player.position.y = p.position.y+0.75; velY = 0; jumping = false; onG = true; break;
                    }
                }
            }
            if (!onG) velY -= 0.008;
            let s = Math.floor(Math.abs(player.position.z)*10); if (s > score) { score = s; document.getElementById("score").innerText = score; }
            camera.position.set(player.position.x, player.position.y+3.5, player.position.z+7); camera.lookAt(player.position.x, player.position.y, player.position.z-2);
            if (player.position.y < -10) { isOver = true; document.getElementById("go").style.display = "block"; }
            renderer.render(scene, camera);
        }
        function reset() {
            score = 0; document.getElementById("score").innerText = "0"; document.getElementById("go").style.display = "none";
            player.position.set(0,2,0); velY = 0; jumping = false; isOver = false; buildTrack(); animate();
        }
        window.onload = init;
    </script>
</body>
</html>
